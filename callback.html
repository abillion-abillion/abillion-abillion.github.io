<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>callback</title></head>
<body>
<script>
  const code = new URLSearchParams(window.location.search).get('code');
  if(code) {
    document.body.innerHTML = '<h2>✅ 코드 복사하세요:</h2><p style="font-size:18px;word-break:break-all;background:#f0f0f0;padding:20px;">' + code + '</p>';
  }
</script>
</body>
</html>
