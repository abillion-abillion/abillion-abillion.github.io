<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8a4e18"/>
      <stop offset="25%" style="stop-color:#6b3510"/>
      <stop offset="60%" style="stop-color:#4e2208"/>
      <stop offset="100%" style="stop-color:#351508"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a3e12"/>
      <stop offset="50%" style="stop-color:#542808"/>
      <stop offset="100%" style="stop-color:#3d1c05"/>
    </linearGradient>
    <linearGradient id="buckleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff0a0"/>
      <stop offset="25%" style="stop-color:#ffe44d"/>
      <stop offset="55%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#c8a000"/>
    </linearGradient>
    <linearGradient id="buckleShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#ffe97a;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9a5520"/>
      <stop offset="100%" style="stop-color:#4e2208"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c07030;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#c07030;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </radialGradient>
    <!-- 가죽 노이즈 텍스처 -->
    <filter id="leather" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="buckleGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="12" y="38" width="76" height="52" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="100" height="100" fill="url(#bgGrad)" rx="12"/>

  <!-- 손잡이 -->
  <path d="M35 38 L35 30 Q35 22 50 22 Q65 22 65 30 L65 38"
        fill="none" stroke="url(#handleGrad)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M36 38 L36 30.5 Q36 24 50 24 Q64 24 64 30.5 L64 38"
        fill="none" stroke="#a06028" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- 손잡이 연결 고리 -->
  <rect x="31" y="35" width="8" height="7" rx="2" fill="url(#buckleGrad)" filter="url(#shadow)"/>
  <rect x="32" y="35.5" width="6" height="2.5" rx="1" fill="url(#buckleShine)" opacity="0.9"/>
  <rect x="61" y="35" width="8" height="7" rx="2" fill="url(#buckleGrad)" filter="url(#shadow)"/>
  <rect x="62" y="35.5" width="6" height="2.5" rx="1" fill="url(#buckleShine)" opacity="0.9"/>

  <!-- 가방 본체 (짙은 가죽) -->
  <rect x="12" y="38" width="76" height="52" rx="6" ry="6"
        fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- 가죽 텍스처 오버레이 -->
  <rect x="12" y="38" width="76" height="52" rx="6" ry="6"
        fill="url(#bodyGrad)" filter="url(#leather)" opacity="0.35"/>

  <!-- 본체 상단 하이라이트 -->
  <rect x="12" y="38" width="76" height="16" rx="6" ry="6"
        fill="url(#shineGrad)" clip-path="url(#bodyClip)"/>

  <!-- 좌우 세로 하이라이트 (가죽 입체감) -->
  <rect x="12" y="38" width="6" height="52" rx="3"
        fill="#a06030" opacity="0.18" clip-path="url(#bodyClip)"/>
  <rect x="82" y="38" width="6" height="52" rx="3"
        fill="#000" opacity="0.25" clip-path="url(#bodyClip)"/>

  <!-- 중앙 가로선 (뚜껑 구분) -->
  <line x1="12" y1="58" x2="88" y2="58" stroke="#2a1004" stroke-width="2"/>
  <line x1="12" y1="59.5" x2="88" y2="59.5" stroke="#9a5020" stroke-width="0.8" opacity="0.35"/>

  <!-- 앞면 패널 -->
  <rect x="22" y="62" width="56" height="22" rx="3"
        fill="url(#frontGrad)" stroke="#2a1004" stroke-width="1.2"/>
  <rect x="22" y="62" width="56" height="7" rx="3"
        fill="#8a4515" opacity="0.25"/>

  <!-- 중앙 버클 베이스 (밝은 금색) -->
  <rect x="39" y="53" width="22" height="13" rx="3.5"
        fill="url(#buckleGrad)" filter="url(#shadow)"/>
  <!-- 버클 내부 오목 -->
  <rect x="43" y="57" width="14" height="6" rx="2"
        fill="#7a5000" opacity="0.45"/>
  <!-- 버클 상단 하이라이트 (밝게) -->
  <rect x="40" y="53.5" width="20" height="4" rx="2"
        fill="url(#buckleShine)"/>
  <!-- 버클 좌우 반사 -->
  <ellipse cx="43" cy="57" rx="2" ry="1.5" fill="#fff8c0" opacity="0.4"/>

  <!-- 버클 잠금 핀 -->
  <rect x="46.5" y="50" width="7" height="5.5" rx="2"
        fill="url(#buckleGrad)" stroke="#c8a000" stroke-width="0.5"/>
  <rect x="47.5" y="50.5" width="5" height="2" rx="1"
        fill="url(#buckleShine)" opacity="0.8"/>

  <!-- 스티치 (왼쪽) -->
  <line x1="17" y1="42" x2="17" y2="86" stroke="#2a1004" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7"/>
  <!-- 스티치 (오른쪽) -->
  <line x1="83" y1="42" x2="83" y2="86" stroke="#2a1004" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- 하단 두꺼운 바닥 -->
  <rect x="12" y="83" width="76" height="7" rx="4" fill="#2e1306" opacity="0.7"/>

  <!-- 바닥 반사 -->
  <ellipse cx="50" cy="95" rx="28" ry="3.5" fill="#000" opacity="0.35"/>
</svg>
