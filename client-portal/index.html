<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>고객 포털 로그인</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body class="portal-bg">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand" aria-label="JW Financial Consulting">
        <span class="brand-mark" aria-hidden="true">JW</span>
        <div class="brand-copy">
          <p class="eyebrow">JW Client Portal</p>
          <h1>고객 자산관리 포털</h1>
        </div>
      </div>
      <p class="help-text">내 전담 자산관리사가 설계한 전용 공간입니다. 고객 라벨 또는 등록된 이메일로 로그인할 수 있습니다.</p>

      <div id="login-view">
        <form id="login-form" class="stack">
          <label class="field">
            <span>아이디 또는 이메일</span>
            <input id="login-id" type="text" autocomplete="username" placeholder="예: 92_기혼남_홍길동_26.03" required>
          </label>

          <label class="field">
            <span>비밀번호</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
          </label>

          <button type="submit" id="login-submit">로그인</button>
        </form>

        <p id="login-message" class="message" aria-live="polite"></p>
        <button type="button" id="show-signup" class="ghost-button auth-toggle-button">고객 등록</button>
        <button type="button" id="show-recovery" class="ghost-button auth-toggle-button">아이디/비밀번호 찾기</button>
      </div>

      <div id="recovery-view" class="hidden">
        <form id="recovery-form" class="stack">
          <p class="help-text">가입 시 등록한 이메일로 계정 정보를 다시 찾을 수 있습니다.</p>

          <label class="field">
            <span>가입 이메일</span>
            <input id="recovery-email" type="email" autocomplete="email" placeholder="name@example.com" required>
          </label>

          <button type="button" id="recover-auto" class="ghost-button">자동 복구 실행</button>

          <div class="form-action-row">
            <button type="button" id="recover-send-password" class="ghost-button">비밀번호 재설정 메일</button>
            <button type="button" id="recover-find-id" class="ghost-button">아이디 확인</button>
          </div>
        </form>

        <p id="recovery-message" class="message" aria-live="polite"></p>
        <button type="button" id="show-login-from-recovery" class="ghost-button auth-toggle-button">로그인 화면으로 돌아가기</button>
      </div>

      <div id="signup-view" class="hidden">
        <form id="signup-form" class="stack">
          <label class="field">
            <span>이름</span>
            <input id="signup-name" type="text" autocomplete="name" placeholder="이름" required>
          </label>

          <label class="field">
            <span>이메일</span>
            <input id="signup-email" type="email" autocomplete="email" placeholder="name@example.com" required>
          </label>

          <label class="field">
            <span>비밀번호</span>
            <input id="signup-password" type="password" autocomplete="new-password" placeholder="비밀번호" required>
          </label>

          <label class="field">
            <span>비밀번호 확인</span>
            <input id="signup-password-confirm" type="password" autocomplete="new-password" placeholder="비밀번호 확인" required>
          </label>

          <button type="submit" id="signup-submit">가입하기</button>
        </form>

        <p id="signup-message" class="message" aria-live="polite"></p>
        <button type="button" id="show-login" class="ghost-button auth-toggle-button">로그인으로 돌아가기</button>
      </div>

      <p class="caption">개인정보 보호를 위해 로그인 후에만 데이터가 표시됩니다.</p>
      <p class="login-footnote">© JW Financial Consulting · 개인정보는 암호화되어 안전하게 보호됩니다.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./supabase-portal.js"></script>
  <script src="./login.js"></script>
</body>
</html>
